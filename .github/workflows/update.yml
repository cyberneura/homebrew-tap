name: Update

# The tap keeps itself current: it asks each project for its latest release
# rather than each project pushing here. Pushing would mean giving every project
# a token that can write to this repository; asking needs nothing beyond the
# token Actions already hands a workflow over its own repository.
on:
  schedule:
    # Hourly. A tap that is an hour behind is a tap that works; the trade is
    # against handing out credentials.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Point every cask and formula at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update.py

      - name: Commit
        id: commit
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One commit per file, so that `git log Casks/foo.rb` reads as that
          # cask's history rather than as a list of days on which something moved.
          moved=""
          for file in $(git diff --name-only); do
            version=$(sed -n 's/^ *version "\(.*\)"/\1/p' "$file" | head -1)
            name=$(basename "$file" .rb)
            git add "$file"
            git commit -m "$name $version"
            moved="${moved:+$moved, }$name $version"
          done
          git push
          echo "moved=$moved" >> "$GITHUB_OUTPUT"

      # Announced only when something moved, and only after the push: an
      # announcement of an update that is not in the tap yet sends people to fetch
      # something that is not there.
      #
      # Neither of these may fail the run. The tap is updated either way, and a
      # webhook that is down is not a reason to look at a red workflow.
      - name: Say so
        if: steps.commit.outputs.moved != ''
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALEXA_WEBHOOK_TOKEN: ${{ secrets.ALEXA_WEBHOOK_TOKEN }}
          MOVED: ${{ steps.commit.outputs.moved }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            jq -n --arg text "Homebrew tap updated: ${MOVED}. <${RUN_URL}|Detail>" \
              '{channel: "C06TSP3NVJL", username: "Homebrew tap", icon_emoji: ":beer:", text: $text}' \
              | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
          else
            echo "::notice::SLACK_WEBHOOK_URL is not set; not announcing to Slack"
          fi

          if [ -n "$ALEXA_WEBHOOK_TOKEN" ]; then
            jq -n --arg text "Homebrew tap updated. ${MOVED}." \
              '{device: "書斎 Echo Dot", text: $text}' \
              | curl -sS -X POST -H 'Content-Type: application/json' \
                  -H "Authorization: Bearer $ALEXA_WEBHOOK_TOKEN" \
                  -d @- "https://alexa-webhook.ytyng.com/speak"
          else
            echo "::notice::ALEXA_WEBHOOK_TOKEN is not set; not speaking"
          fi
